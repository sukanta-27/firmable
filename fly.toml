app = "firmable"
primary_region = "sin"

[http_service]
  internal_port = 8080
  force_https = true
  # The login throttle lives in memory, so there is exactly one machine and it never stops.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
