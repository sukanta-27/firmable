<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Log in · Exposure leads</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="container login">
    <article>
      <h1 class="logo">Exposure leads</h1>
      {% if message %}
        <p class="notice" role="alert">{{ message }}</p>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Username
          <input name="username" autocomplete="username" required value="{{ username }}"
                 {% if not username %}autofocus{% endif %}>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required
                 {% if username %}autofocus{% endif %}>
        </label>
        <button type="submit">{% if next != "/" %}Log in and continue{% else %}Log in{% endif %}</button>
      </form>
      <p class="muted small">Access is by invitation. <a href="/writeup">Read how it works</a> without logging in.</p>
    </article>
  </main>
</body>
</html>
